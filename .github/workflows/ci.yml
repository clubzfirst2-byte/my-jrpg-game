name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: on ubuntu-latest (26.04) the browsers' system packages download very slowly from the
    # runner's mirror and the runs ran out of time; Playwright supports 24.04.
    runs-on: ubuntu-24.04
    # The browser download sometimes stalls on the runner; it has its own limit and one retry below.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Data integrity (items.json)
        run: npm run check:data
      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=reports/unit.json
      - name: Build
        run: npm run build
      # System packages once (apt holds a lock, so it must not be cut off and retried), then the
      # browser download, which sometimes stalls: it has its own limit and one retry.
      - name: Install browser system packages
        timeout-minutes: 20
        run: npx playwright install-deps chromium webkit
      - name: Download Playwright browsers
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            timeout 300 npx playwright install chromium webkit && exit 0
            echo "Browser download attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: E2E tests (iPhone viewport, Chromium + WebKit)
        run: npx playwright test
      - name: Test summary
        if: always()
        run: node tools/ci-summary.mjs reports/unit.json reports/e2e.json
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
